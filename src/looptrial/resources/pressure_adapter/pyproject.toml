[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "looptrial-example-pressure"
version = "0.1.0"
description = "Read-only LoopTrial adapter for a simple 50 Hz pressure logger CSV"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11"

[project.entry-points."looptrial.devices"]
pressure = "legacy_pressure"

[tool.setuptools]
py-modules = ["legacy_pressure"]
